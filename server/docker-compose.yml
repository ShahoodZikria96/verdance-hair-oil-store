# Local MySQL for development.
#   docker compose up -d
#   npm run prisma:migrate
#   npm run prisma:seed
services:
  mysql:
    image: mysql:8.4
    container_name: verdance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hair_oil_store
      MYSQL_USER: verdance
      MYSQL_PASSWORD: verdance
    ports:
      - '3306:3306'
    volumes:
      - verdance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  verdance_mysql_data:
