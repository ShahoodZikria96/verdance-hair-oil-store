<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Verdance Signature Hair Oil bottle">
  <defs>
    <linearGradient id="sigGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5a44" />
      <stop offset="0.5" stop-color="#25412f" />
      <stop offset="1" stop-color="#182f22" />
    </linearGradient>
    <linearGradient id="sigShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sigFloor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b2b28" stop-opacity="0.18" />
      <stop offset="1" stop-color="#2b2b28" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="690" rx="170" ry="26" fill="url(#sigFloor)" />

  <!-- botanical sprig -->
  <g stroke="#5f8a70" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M300 150 C 250 90, 210 70, 170 60" />
    <path d="M262 118 C 250 92, 232 84, 214 82" />
    <path d="M244 138 C 236 118, 222 112, 206 112" />
    <path d="M283 132 C 300 92, 320 78, 344 70" />
  </g>
  <g fill="#8daf98" opacity="0.95">
    <ellipse cx="176" cy="58" rx="16" ry="8" transform="rotate(-24 176 58)" />
    <ellipse cx="210" cy="80" rx="13" ry="7" transform="rotate(-14 210 80)" />
    <ellipse cx="204" cy="112" rx="12" ry="6" transform="rotate(-6 204 112)" />
    <ellipse cx="348" cy="66" rx="15" ry="8" transform="rotate(22 348 66)" />
  </g>

  <!-- cap -->
  <rect x="266" y="150" width="68" height="46" rx="4" fill="#1f3d2b" />
  <rect x="272" y="140" width="56" height="16" rx="3" fill="#c9a96a" />
  <rect x="266" y="150" width="68" height="10" rx="3" fill="#ffffff" opacity="0.08" />

  <!-- neck -->
  <rect x="278" y="196" width="44" height="34" fill="#20392a" />

  <!-- body -->
  <path d="M196 250 C 196 232, 210 230, 244 230 L 356 230 C 390 230, 404 232, 404 250 L 404 604 C 404 648, 372 672, 300 672 C 228 672, 196 648, 196 604 Z" fill="url(#sigGlass)" />
  <path d="M196 250 C 196 232, 210 230, 244 230 L 356 230 C 390 230, 404 232, 404 250 L 404 604 C 404 648, 372 672, 300 672 C 228 672, 196 648, 196 604 Z" fill="url(#sigShine)" />
  <path d="M214 262 C 214 250, 224 246, 236 246 L 236 640 C 224 636, 214 624, 214 604 Z" fill="#ffffff" opacity="0.10" />

  <!-- label -->
  <rect x="230" y="330" width="140" height="220" rx="4" fill="#fbf8f1" />
  <rect x="230" y="330" width="140" height="220" rx="4" fill="none" stroke="#e0cba6" stroke-width="1.5" />
  <text x="300" y="378" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#1f3d2b" font-style="italic">Verdance</text>
  <line x1="262" y1="396" x2="338" y2="396" stroke="#c9a96a" stroke-width="1.5" />
  <text x="300" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="3" fill="#55534d">SIGNATURE</text>
  <text x="300" y="452" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" letter-spacing="3" fill="#55534d">HAIR OIL</text>
  <g stroke="#5f8a70" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 486 C 288 470, 282 462, 272 458" />
    <path d="M300 486 C 312 470, 318 462, 328 458" />
    <path d="M300 486 L 300 512" />
  </g>
  <text x="300" y="536" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="2" fill="#807d75">100 ML / NATURAL</text>
</svg>
